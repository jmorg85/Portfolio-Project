name: Test workflow

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build project
        run: npm run build -- --configuration production
